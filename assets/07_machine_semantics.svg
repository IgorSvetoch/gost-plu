<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480"><rect width="100%" height="100%" fill="#fffef9"/><rect x="10" y="10" width="940" height="460" rx="18" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="8 6"/><text x="45" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700">Как LLM работает со смыслом</text><text x="55" y="145" font-family="Arial,sans-serif" font-size="27" fill="#2456c5">текст → токены → векторы</text><text x="55" y="210" font-family="Arial,sans-serif" font-size="27" fill="#c63d37">→ Transformer → контекстные представления</text><text x="55" y="280" font-family="Arial,sans-serif" font-size="27" fill="#2c7c49">→ P(next token) → ответ</text><text x="55" y="360" font-family="Arial,sans-serif" font-size="27">предсказание требует восстановления отношений</text></svg>